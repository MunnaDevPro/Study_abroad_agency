<section class="py-20 bg-white">
    <style>
         :root {
            --brand-color: #4f46e5;
        }
        
        .process-wrapper {
            position: relative;
            max-width: 1100px;
            margin: 0 auto;
            padding: 100px 0;
        }
        /* মাঝখানের সোজা লাইন (Pipe Line) */
        
        .process-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 4px;
            background: #f0f0f0;
            transform: translateY(-50%);
            z-index: 1;
        }
        
        .process-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            position: relative;
            z-index: 2;
        }
        
        .step-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .step-number {
            width: 40px;
            height: 40px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #6b7280;
            z-index: 3;
            margin: 0;
        }
        
        .step-content {
            position: absolute;
            width: 160px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* ১, ৩, ৫ নম্বর ধাপ (উপরে) */
        
        .step-item.odd .step-content {
            bottom: 55px;
        }
        /* ২, ৪, ৬ নম্বর ধাপ (নিচে) */
        
        .step-item.even .step-content {
            top: 55px;
            flex-direction: column-reverse;
        }
        
        .step-icon {
            color: var(--brand-color);
            margin-bottom: 8px;
        }
        
        .step-item.even .step-icon {
            margin-top: 8px;
            margin-bottom: 0;
        }
        
        .step-title {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            line-height: 1.2;
        }
        
        @media (max-width: 1024px) {
            .process-wrapper::before {
                display: none;
            }
            .process-grid {
                grid-template-columns: 1fr 1fr;
                gap: 50px;
            }
            .step-content {
                position: relative;
                bottom: auto !important;
                top: auto !important;
                margin: 10px 0;
            }
            .step-item.even {
                flex-direction: column;
            }
            .step-item.even .step-content {
                flex-direction: column;
            }
        }
    </style>
